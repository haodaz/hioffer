[project]
name = "hioffer"
version = "0.1.0"
description = "A PhD-application agent (neatHack 2026)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "neatlogs",
    "openai",
    "httpx",
    "python-dotenv",
    "pyyaml",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pypdf>=6.20.0",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
