<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  html, body { width:1920px; height:1080px; overflow:hidden; font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif; color:#16213a;
    background: radial-gradient(1100px 700px at 10% 0%, #e4ecff 0%, transparent 60%), radial-gradient(900px 600px at 100% 10%, #fdeeea 0%, transparent 55%), #f5f7fb; }
  .wrap { position:relative; width:1920px; height:1080px; padding:96px 110px }
  .logo { display:flex; align-items:center; gap:18px; font-size:54px; font-weight:800; letter-spacing:-1px }
  .logo img { height:66px } .logo b { color:#2f6bff }
  h1 { margin-top:120px; font-size:88px; line-height:1.05; letter-spacing:-2.5px; font-weight:700; max-width:900px }
  h1 span { color:#2f6bff }
  p.sub { margin-top:34px; font-size:32px; line-height:1.4; color:#6b7a90; max-width:800px }
  .tools { position:absolute; left:110px; bottom:96px; display:flex; gap:16px }
  .tools span { background:#fff; border:2px solid #e4e9f2; border-radius:999px; padding:14px 26px; font-size:26px; font-weight:600; color:#16213a; box-shadow:0 10px 30px -18px rgba(22,33,58,.35) }
  .tools span b { color:#2f6bff; font-weight:700 }
  .mascot { position:absolute; right:20px; bottom:0; height:860px }
  .badge { position:absolute; right:110px; top:96px; background:#16213a; color:#fff; border-radius:999px; padding:14px 26px; font-size:26px; font-weight:600 }
  .glow { position:absolute; right:140px; bottom:120px; width:760px; height:760px; border-radius:50%; background:#e9f0ff; filter:blur(80px); opacity:.9 }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="../../web/public/mascot-bot.png" alt=""/><span>Hi<b>Offer</b></span></div>
  <div class="badge">neatHack 2026 · 2:57 demo</div>
  <div class="glow"></div>
  <img class="mascot" src="../../web/public/mascot-duo.png" alt=""/>
  <h1>From school list<br/>to offer. <span>Carefully,<br/>with your AI.</span></h1>
  <p class="sub">Nothing invented: every claim has a source. Nothing missed: deadlines, letters, fees, all dated. Nothing sent without you.</p>
  <div class="tools"><span>traced with <b>neatlogs</b></span><span>checkpointed with <b>Entire</b></span><span>priced with <b>cfo.ai</b></span></div>
</div>
</body>
</html>
